<svg width="1600" height="500" viewBox="0 0 1600 500"
     fill="none"
     xmlns="http://www.w3.org/2000/svg">

  <defs>

    <!-- Main background -->
    <linearGradient id="background"
                    x1="0"
                    y1="0"
                    x2="1600"
                    y2="500"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B14"/>
      <stop offset="0.5" stop-color="#0B1120"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>

    <!-- Blue/Violet accent -->
    <linearGradient id="accent"
                    x1="520"
                    y1="0"
                    x2="1080"
                    y2="0"
                    gradientUnits="userSpaceOnUse">
      <stop stop-color="#38BDF8"/>
      <stop offset="0.5" stop-color="#6366F1"/>
      <stop offset="1" stop-color="#A855F7"/>
    </linearGradient>

    <!-- Soft glow -->
    <radialGradient id="blueGlow"
                    cx="0"
                    cy="0"
                    r="1"
                    gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(350 100) rotate(32) scale(520 280)">
      <stop stop-color="#2563EB" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#2563EB" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="violetGlow"
                    cx="0"
                    cy="0"
                    r="1"
                    gradientUnits="userSpaceOnUse"
                    gradientTransform="translate(1300 400) rotate(200) scale(500 280)">
      <stop stop-color="#7C3AED" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#7C3AED" stop-opacity="0"/>
    </radialGradient>

    <!-- Grid -->
    <pattern id="grid"
             width="48"
             height="48"
             patternUnits="userSpaceOnUse">
      <path d="M 48 0 L 0 0 0 48"
            fill="none"
            stroke="#94A3B8"
            stroke-opacity="0.055"
            stroke-width="1"/>
    </pattern>

    <!-- Glow filter -->
    <filter id="glow"
            x="-50%"
            y="-50%"
            width="200%"
            height="200%">
      <feGaussianBlur stdDeviation="8"
                      result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

  </defs>


  <!-- Background -->
  <rect width="1600"
        height="500"
        rx="28"
        fill="url(#background)"/>

  <!-- Background glows -->
  <rect width="1600"
        height="500"
        rx="28"
        fill="url(#blueGlow)"/>

  <rect width="1600"
        height="500"
        rx="28"
        fill="url(#violetGlow)"/>

  <!-- Grid -->
  <rect width="1600"
        height="500"
        rx="28"
        fill="url(#grid)"/>


  <!-- Decorative engineering nodes -->

  <circle cx="165"
          cy="125"
          r="5"
          fill="#38BDF8"
          opacity="0.75"/>

  <circle cx="240"
          cy="180"
          r="4"
          fill="#6366F1"
          opacity="0.7"/>

  <circle cx="180"
          cy="255"
          r="4"
          fill="#A855F7"
          opacity="0.65"/>

  <path d="M165 125 L240 180 L180 255"
        stroke="#38BDF8"
        stroke-opacity="0.18"
        stroke-width="1.5"/>


  <circle cx="1430"
          cy="115"
          r="5"
          fill="#A855F7"
          opacity="0.75"/>

  <circle cx="1360"
          cy="180"
          r="4"
          fill="#6366F1"
          opacity="0.7"/>

  <circle cx="1440"
          cy="250"
          r="4"
          fill="#38BDF8"
          opacity="0.65"/>

  <path d="M1430 115 L1360 180 L1440 250"
        stroke="#A855F7"
        stroke-opacity="0.18"
        stroke-width="1.5"/>


  <!-- Left code decoration -->

  <text x="95"
        y="365"
        fill="#38BDF8"
        fill-opacity="0.22"
        font-family="monospace"
        font-size="28">
    &lt;/&gt;
  </text>

  <text x="1450"
        y="360"
        fill="#A855F7"
        fill-opacity="0.22"
        font-family="monospace"
        font-size="28">
    { }
  </text>


  <!-- Small top tag -->

  <rect x="650"
        y="62"
        width="300"
        height="42"
        rx="21"
        fill="#111827"
        stroke="#334155"
        stroke-width="1"/>

  <circle cx="680"
          cy="83"
          r="5"
          fill="#22C55E"/>

  <text x="700"
        y="90"
        fill="#CBD5E1"
        font-family="Arial, Helvetica, sans-serif"
        font-size="16"
        font-weight="600"
        letter-spacing="2">
    SOFTWARE ENGINEERING
  </text>


  <!-- Main name -->

  <text x="800"
        y="205"
        text-anchor="middle"
        fill="#F8FAFC"
        font-family="Arial, Helvetica, sans-serif"
        font-size="70"
        font-weight="700"
        letter-spacing="6">
    PARNEET KAUR
  </text>


  <!-- Gradient underline -->

  <rect x="555"
        y="228"
        width="490"
        height="4"
        rx="2"
        fill="url(#accent)"
        filter="url(#glow)"/>


  <!-- Main specialization -->

  <text x="800"
        y="290"
        text-anchor="middle"
        fill="#CBD5E1"
        font-family="Arial, Helvetica, sans-serif"
        font-size="25"
        font-weight="600"
        letter-spacing="4">
    JAVA • BACKEND • FULL STACK • AI
  </text>


  <!-- Main philosophy -->

  <text x="800"
        y="350"
        text-anchor="middle"
        fill="#94A3B8"
        font-family="Arial, Helvetica, sans-serif"
        font-size="19"
        font-weight="400"
        letter-spacing="1.6">
    Building software with an engineering-first mindset.
  </text>


  <!-- Footer philosophy -->

  <text x="800"
        y="425"
        text-anchor="middle"
        fill="#64748B"
        font-family="Arial, Helvetica, sans-serif"
        font-size="16"
        font-weight="600"
        letter-spacing="3">
    BUILD  •  UNDERSTAND  •  ENGINEER  •  IMPROVE
  </text>


  <!-- Border -->
  <rect x="1"
        y="1"
        width="1598"
        height="498"
        rx="27"
        stroke="#334155"
        stroke-opacity="0.55"
        stroke-width="2"/>

</svg>