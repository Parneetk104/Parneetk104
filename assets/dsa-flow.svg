<svg
width="1400"
height="190"
viewBox="0 0 1400 190"
fill="none"
xmlns="http://www.w3.org/2000/svg">

  <defs>

```
<linearGradient id="lineGradient"
  x1="100"
  y1="0"
  x2="1300"
  y2="0"
  gradientUnits="userSpaceOnUse">

  <stop stop-color="#38BDF8"/>
  <stop offset="0.5" stop-color="#6366F1"/>
  <stop offset="1" stop-color="#A855F7"/>

</linearGradient>

<filter id="softGlow"
  x="-50%"
  y="-50%"
  width="200%"
  height="200%">

  <feGaussianBlur
    stdDeviation="5"
    result="blur"/>

  <feMerge>
    <feMergeNode in="blur"/>
    <feMergeNode in="SourceGraphic"/>
  </feMerge>

</filter>
```

  </defs>

  <!-- Main Flow Line -->

<line
 x1="140"
 y1="95"
 x2="1260"
 y2="95"
 stroke="#334155"
 stroke-width="3"
 stroke-linecap="round"/>

  <!-- Animated progress line -->

<line
 x1="140"
 y1="95"
 x2="1260"
 y2="95"
 stroke="url(#lineGradient)"
 stroke-width="4"
 stroke-linecap="round"
 stroke-dasharray="150 970"
 filter="url(#softGlow)">

```
<animate
  attributeName="stroke-dashoffset"
  values="1120;0"
  dur="8s"
  repeatCount="indefinite"/>
```

  </line>

  <!-- STEP 1 -->

  <g>

```
<circle
  cx="140"
