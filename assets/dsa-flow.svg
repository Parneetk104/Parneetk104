  <!-- Animated traveling point -->

<circle
 cx="140"
 cy="95"
 r="7"
 fill="#F8FAFC"
 filter="url(#softGlow)">

```
<animate
  attributeName="cx"
  values="140;420;700;980;1260;140"
  keyTimes="0;0.2;0.4;0.6;0.8;1"
  dur="8s"
  repeatCount="indefinite"/>

